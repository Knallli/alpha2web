# alpha2web: web UI for a Sony Alpha camera.
#
#   docker compose up -d
#   open http://<this-host>:8765
#
# The camera is found automatically on the local network. A fixed address
# can be set on the Settings page or in .env.
#
# Optional settings (camera address, password for the UI, ...) can go into a
# .env file, see .env.example.
#
# Monitoring: /healthz (Docker HEALTHCHECK), /health (JSON) and /metrics
# (Prometheus) need no password. Logs: LOG_LEVEL, LOG_FORMAT.
services:
  alpha2web:
    image: ghcr.io/knallli/alpha2web:latest
    container_name: alpha2web
    restart: unless-stopped
    # Needed to find the camera on the LAN (discovery does not cross Docker's bridge network).
    # The UI listens on port 8765 of the host (HTTP_ADDR).
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      - data:/data   # settings (incl. camera password, API keys), plugin state
      - staging:/staging   # downloaded files until Immich has them; use a big disk or a bind mount
      - library:/library   # originals pulled in the gallery: <camera>/slot<N>/DCIM/...
      # To keep them on the host or a NAS share, use a bind mount instead:
      # - /mnt/nas/photos/sony:/library
    environment:
      STAGING_DIR: /staging
      LIBRARY_DIR: /library
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
  staging:
  library:
