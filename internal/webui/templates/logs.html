{{template "header" .}}
<section class="card">
<form method="get" action="/logs" class="toolbar"><label for="lv">Level</label>
<select id="lv" name="level" data-autosubmit>{{range .Levels}}<option{{if eq . $.Level}} selected{{end}}>{{.}}</option>{{end}}</select><button class="secondary">Show</button>
<input type="search" id="lf" placeholder="Filter lines…" aria-label="Filter log lines" data-filter=".log > div">
<label class="check"><input type="checkbox" id="lf-follow" checked> Follow</label></form>
<div class="log" data-refresh="/fragment/logs?level={{.Level}}" data-every="2000" data-scroll="1">{{template "logrows" .Entries}}</div></section>
{{template "footer" .}}

{{define "logrows"}}{{range .}}<div class="l-{{.Level}}"><span class="t">{{.Time.Format "15:04:05"}}</span> <b>{{.Level}}</b> {{.Msg}} <span class="a">{{.Attrs}}</span></div>{{else}}<div class="muted">No log entries.</div>{{end}}{{end}}
