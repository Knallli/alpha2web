{{template "header" .}}
{{if .Msg}}<div class="msg ok">Done: {{.Msg}}</div>{{end}}{{if .Err}}<div class="msg bad">{{.Err}}</div>{{end}}
<section class="card"><h2>Shutter</h2><div class="actions">
<form method="post" action="/actions/capture"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="secondary">Capture (manual focus)</button></form>
<form method="post" action="/actions/capture"><input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="af" value="1"><button>Capture with autofocus</button></form>
<form method="post" action="/actions/movie"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="secondary">Start / stop movie</button></form></div></section>
<section class="card"><h2>Properties</h2><div class="scroll"><table>
<tr><th>Code</th><th>Value</th><th></th></tr>
{{range .Props}}<tr><td>0x{{printf "%04X" .Code}}</td><td>{{.Current}}</td><td>{{if .Writable}}
<form method="post" action="/actions/setprop" class="inline"><input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="code" value="{{.Code}}">
{{if .Choices}}<select name="value">{{range .Choices}}<option>{{.}}</option>{{end}}</select>{{else}}<input name="value" value="{{.Current}}">{{end}}
<button class="secondary">Set</button></form>{{end}}</td></tr>{{end}}</table></div></section>
{{template "footer" .}}
